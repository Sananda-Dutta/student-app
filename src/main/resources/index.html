<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5f9; margin: 0; padding: 30px; }
    .card { max-width: 460px; margin: auto; background: #fff; padding: 24px 28px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    h1 { margin-top: 0; font-size: 22px; color: #1f3a5f; }
    label { display: block; margin: 14px 0 4px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box;
                    border: 1px solid #bbb; border-radius: 4px; }
    button { margin-top: 20px; padding: 10px 24px; background: #1f6feb; color: #fff;
             border: 0; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #1558c0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Student Registration Form</h1>
    <form action="/register" method="post">

      <label for="name">Student Name</label>
      <input type="text" id="name" name="name" required>

      <label for="roll">Roll Number</label>
      <input type="text" id="roll" name="roll" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">-- Select --</option>
        <option>B.Tech CSE</option>
        <option>B.Tech IT</option>
        <option>BCA</option>
        <option>MCA</option>
        <option>M.Tech</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
